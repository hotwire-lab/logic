[package]
name = "hotwire-logic-analyzer"
version = "2.0.0"
edition = "2021"
description = "HotWire Pocket Lab — 8-Channel Logic Analyzer & Tri-State Force I/O in Rust/WASM (Leptos)"
license = "Apache-2.0"

[dependencies]
hotwire-core = { git = "https://github.com/hotwire-lab/hotwire-core", tag = "v0.3.1" }
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Blob",
  "BlobPropertyBag",
  "CanvasRenderingContext2d",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlButtonElement",
  "HtmlCanvasElement",
  "HtmlDivElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlPreElement",
  "HtmlSelectElement",
  "KeyboardEvent",
  "MouseEvent",
  "Navigator",
  "Performance",
  "PointerEvent",
  "Storage",
  "TextMetrics",
  "Url",
  "WheelEvent",
  "Window",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
